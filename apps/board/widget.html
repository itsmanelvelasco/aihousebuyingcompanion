<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReloCat · Homeownership trail</title>
<!-- FAVICON -->
<style>
/* THEME */
/* Journey board layout. Colours, type and components come from packages/ui/theme.css.
   The board is the playful surface of the same family: paper and forest green as everywhere,
   with gold rewards, a "press" shadow on its game pieces and a pixel-art trail. */
main { max-width: 890px; margin: auto; padding: clamp(12px, 3vw, 24px); }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin-bottom: 12px; }
header .rc-lang { margin-left: auto; }
p { color: var(--rc-muted); margin-top: 4px; }
strong { font-weight: var(--rc-weight-semibold); }
h1 { font-size: clamp(1.75rem, 5vw, 2.5rem); margin: 8px 0; }
h2 { font-size: var(--rc-text-xl); line-height: 1.2; }
button:disabled { cursor: progress; opacity: 0.7; }
/* Sentence case: several of these labels run past three words, too long to set in capitals. */
.label { display: block; font: var(--rc-weight-semibold) var(--rc-text-xs) / 1rem var(--rc-font-text); color: var(--rc-violet); }
.small { font-size: var(--rc-text-sm); }
.stack { display: grid; gap: 8px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }

/* Who is on the trail */
.pair { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; color: var(--rc-muted); font-size: var(--rc-text-sm); margin-bottom: 12px; }
.pair a { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; }
.pair .rc-icon { color: var(--rc-accent); }
.nav { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.nav button, .route-chip {
  display: grid;
  gap: 4px;
  min-width: 0;
  min-height: 56px;
  padding: 8px 12px;
  border: 1px solid var(--rc-line);
  border-radius: var(--rc-radius-md);
  background: var(--rc-surface);
  color: var(--rc-muted);
  font-size: var(--rc-text-xs);
  font-weight: var(--rc-weight-semibold);
  text-align: left;
  transition: background-color var(--rc-dur-fast) var(--rc-ease), border-color var(--rc-dur-fast) var(--rc-ease), transform var(--rc-dur-fast) var(--rc-ease);
}
.nav button strong, .route-chip strong { display: block; font-size: var(--rc-text-md); color: var(--rc-ink); }
.nav button[aria-pressed="true"], .route-chip[aria-pressed="true"] { border-color: var(--rc-violet); background: var(--rc-violet-soft); box-shadow: inset 0 0 0 1px var(--rc-violet); }
.nav button[aria-pressed="true"] strong, .route-chip[aria-pressed="true"] strong { color: var(--rc-violet); }
@media (hover: hover) { .nav button:hover:not(:disabled), .route-chip:hover:not(:disabled) { border-color: var(--rc-violet); } }
.nav button:active:not(:disabled), .route-chip:active:not(:disabled) { transform: scale(0.97); }

/* Panels */
.panel { border: 1px solid var(--rc-line); background: var(--rc-surface); border-radius: var(--rc-radius-lg); padding: 16px; margin-top: 12px; }
.hero { border: 0; padding: clamp(16px, 4vw, 24px); overflow: hidden; background: linear-gradient(135deg, var(--rc-night), var(--rc-night-2)); color: var(--rc-on-night); }
.hero .label, .hero strong { color: var(--rc-gold); }
.hero p { color: var(--rc-on-night-muted); max-width: 60ch; }
.hero :focus-visible { outline-color: var(--rc-gold); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.amount { font-weight: var(--rc-weight-semibold); font-size: var(--rc-text-xl); }
#status:empty { display: none; }
#status { padding: 12px; border-radius: var(--rc-radius-md); margin: 8px 0; background: var(--rc-warn-soft); color: var(--rc-warn); }
#view > p:only-child { padding: 24px 0; text-align: center; }
details.panel > summary { margin: -8px 0; }
.alert { border-radius: var(--rc-radius-sm); background: var(--rc-warn-soft); color: var(--rc-warn); padding: 12px; margin-top: 12px; }
.footer { display: flex; justify-content: space-between; align-items: center; gap: 4px 8px; flex-wrap: wrap; margin-top: 16px; font-size: var(--rc-text-xs); color: var(--rc-muted); }
.footer .rc-btn { font-size: var(--rc-text-xs); }

/* Progress meters */
.meter { height: 12px; border-radius: var(--rc-radius-pill); background: var(--rc-track); overflow: hidden; margin: 8px 0 4px; }
.fill { height: 100%; background: linear-gradient(90deg, var(--rc-bar-place), var(--rc-gold)); border-radius: inherit; }
.meter-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: var(--rc-weight-semibold); }
.meter-row strong { font-variant-numeric: tabular-nums; }

/* The trail: a pixel-art world with the traveller on it. Its colours are part of the drawing (apps/board/map.ts)
   and stay the same in both themes, on the theme's fixed night, day and gold. */
.world { position: relative; aspect-ratio: 480 / 260; border-radius: var(--rc-radius-lg); overflow: hidden; border: 2px solid var(--rc-surface); box-shadow: var(--rc-shadow-press); margin-top: 12px; background: #9fd4a7; }
.world canvas { width: 100%; height: 100%; image-rendering: pixelated; }
.dot { position: absolute; width: clamp(24px, 5vw, 44px); aspect-ratio: 1; border: 2px solid var(--rc-night); border-radius: 50% 50% 46% 46%; transform: translate(-50%, -100%); background: radial-gradient(circle at 33% 27%, #fff, var(--rc-day) 50%, var(--rc-gold)); box-shadow: 0 4px 0 color-mix(in srgb, var(--rc-night) 38%, transparent); }
.dot::before, .dot::after { content: ""; position: absolute; top: 42%; width: 14%; aspect-ratio: 1; border-radius: 50%; background: var(--rc-night); }
.dot::before { left: 28%; }
.dot::after { right: 28%; }
.stop { position: absolute; transform: translateX(-50%); background: var(--rc-day); color: var(--rc-on-day); border: 1px solid color-mix(in srgb, var(--rc-night) 25%, transparent); border-radius: var(--rc-radius-xs); padding: 0 4px; font-size: var(--rc-text-xs); line-height: 1rem; font-weight: var(--rc-weight-semibold); white-space: nowrap; }

/* Leaderboard and facts */
.ranks { margin: 8px 0 0; padding-left: 24px; }
.ranks li { padding: 4px 8px; }
.ranks li::marker { color: var(--rc-muted); font-weight: var(--rc-weight-semibold); }
.current { background: var(--rc-violet-soft); border-radius: var(--rc-radius-sm); font-weight: var(--rc-weight-semibold); }
.rank { display: flex; justify-content: space-between; gap: 8px; font-variant-numeric: tabular-nums; }
.facts { margin: 12px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
.facts dt { font-size: var(--rc-text-xs); color: var(--rc-muted); }
.facts dd { font-weight: var(--rc-weight-semibold); overflow-wrap: anywhere; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

/* Intake forms */
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 12px; margin-top: 12px; }
.fields label { align-content: start; }
.preferences fieldset { margin: 12px 0 0; border: 1px solid var(--rc-line); border-radius: var(--rc-radius-md); padding: 8px 12px 12px; min-width: 0; }
.preferences legend { font-size: var(--rc-text-md); font-weight: var(--rc-weight-semibold); padding: 0 4px; }

/* Three stages to owning outright */
.timeline { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; list-style: none; padding: 0; margin: 12px 0; }
.timeline li { border: 1px solid var(--rc-line); border-radius: var(--rc-radius-md); background: var(--rc-surface); padding: 12px; display: grid; gap: 4px; }
.timeline li:last-child { border-color: transparent; background: var(--rc-gold-soft); }
.timeline li:last-child .label { color: var(--rc-warn); }
.timeline li span:last-child { font-size: var(--rc-text-xs); color: var(--rc-muted); }

/* Journey check-in */
.coach { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.level-mark { display: grid; place-items: center; align-content: center; flex: 0 0 72px; aspect-ratio: 1; border: 2px solid var(--rc-gold); border-radius: var(--rc-radius-lg); background: color-mix(in srgb, var(--rc-gold) 12%, transparent); color: var(--rc-gold); box-shadow: 0 4px 0 rgb(0 0 0 / 0.3); }
.level-mark span { font: var(--rc-weight-semibold) var(--rc-text-xs) / 1rem var(--rc-font-text); letter-spacing: 0.06em; }
.level-mark strong { font: var(--rc-weight-semibold) 2rem / 1.1 var(--rc-font-display); }
.momentum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.momentum div, .credit-stats div { border: 1px solid var(--rc-line); background: var(--rc-surface); border-radius: var(--rc-radius-md); padding: 12px; display: grid; gap: 4px; min-width: 0; }
.momentum strong, .credit-stats strong { font: var(--rc-weight-semibold) clamp(1rem, 3vw, 1.375rem) / 1.2 var(--rc-font-display); }
.momentum span, .credit-stats span { font-size: var(--rc-text-xs); color: var(--rc-muted); }
.habits-header, .journey-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.habit { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; margin-top: 12px; padding: 12px; border-radius: var(--rc-radius-md); background: var(--rc-paper); }
.habit-done { background: var(--rc-accent-soft); }
.habit-icon { width: 44px; height: 44px; display: grid; place-items: center; border-radius: var(--rc-radius-md); background: var(--rc-gold-soft); color: var(--rc-warn); }
.habit-icon .rc-icon { width: 24px; height: 24px; }
.habit-done .habit-icon { background: var(--rc-accent); color: var(--rc-on-accent); }
.habit p { font-size: var(--rc-text-md); }
.habit-spend { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }

/* Route comparison */
.route-options { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.secondary-routes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.route-chip span { color: var(--rc-accent); font-size: var(--rc-text-sm); font-weight: var(--rc-weight-semibold); }
.route-chip small { font-weight: inherit; font-size: var(--rc-text-xs); }
.journey-chart canvas { width: 100%; height: clamp(225px, 48vw, 355px); display: block; border: 1px solid var(--rc-line); border-radius: var(--rc-radius-sm); margin-top: 12px; }
.journey-legend { display: flex; gap: 8px 16px; flex-wrap: wrap; margin-top: 8px; font-size: var(--rc-text-xs); color: var(--rc-muted); }
/* The swatches repeat the line colours drawRouteTimeline paints on its fixed light canvas. */
.journey-legend span::before { content: ""; display: inline-block; width: 16px; height: 4px; border-radius: 2px; margin-right: 8px; vertical-align: middle; background: #a3a797; }
.journey-legend .past::before { background: #1f7a55; }
.journey-legend .selected-line::before { background: #7950a7; }

/* The finish */
.payoff { text-align: center; }
.payoff .hero { padding-block: 28px; }
.payoff .hero p { margin-inline: auto; }
.credits { position: relative; border: 0; padding: clamp(16px, 5vw, 32px); overflow: hidden; background: var(--rc-night); color: var(--rc-on-night); }
.credits > p, .credits li p { color: var(--rc-on-night-muted); }
.credits .label { color: var(--rc-gold); }
.credits :focus-visible { outline-color: var(--rc-gold); }
.credit-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
.credit-stats div { background: rgb(255 255 255 / 0.07); border-color: rgb(255 255 255 / 0.15); }
.credit-stats strong { color: var(--rc-gold); }
.credit-stats span { color: var(--rc-on-night-muted); }
.credit-milestones { padding-left: 24px; margin: 16px 0; }
.credit-milestones li { padding: 4px 0; }
.credit-milestones li::marker { color: var(--rc-gold); font-weight: var(--rc-weight-semibold); }
.victory { position: relative; isolation: isolate; text-align: center; border-radius: var(--rc-radius-md); overflow: hidden; padding: 20px 12px 24px; background: radial-gradient(ellipse at center, #2f6f52, var(--rc-night) 70%); border: 1px solid rgb(255 255 255 / 0.16); }
.victory h1 { position: relative; margin-top: 8px; font-size: clamp(2rem, 7.8vw, 3rem); color: var(--rc-gold); text-shadow: 0 3px rgb(0 0 0 / 0.35); }
.victory p { color: var(--rc-on-night); }
.victory-medal { position: relative; display: grid; place-items: center; width: 80px; height: 80px; margin: 0 auto 8px; border-radius: 50%; background: radial-gradient(circle, #fff6c4, var(--rc-gold)); border: 4px solid #fff0bb; box-shadow: 0 0 30px rgb(246 201 92 / 0.7); color: var(--rc-gold-ink); }
.victory-medal .rc-icon { width: 40px; height: 40px; }
.celebration { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
.celebration span { position: absolute; left: 50%; top: 44%; width: clamp(16px, 4vw, 30px); opacity: 0; color: var(--rc-gold); }
.celebration span:nth-child(3n) { color: #b9eccd; }
.celebration span:nth-child(4n) { color: #dcc4ff; }
.celebration .rc-icon { width: 100%; height: 100%; }
@media (prefers-reduced-motion: no-preference) {
  /* The finish is the board's one celebration: a short rise for the credits, then the medal and one burst. */
  .credits > * { animation: credit-enter var(--rc-dur-slow) var(--rc-ease) both; }
  .credits > *:nth-child(4) { animation-delay: 75ms; }
  .credits > *:nth-child(n + 5) { animation-delay: 150ms; }
  .victory-medal { animation: medal-pop 0.5s var(--rc-ease) both; }
  .celebration span { animation: firework 1.2s var(--delay) var(--rc-ease) both; }
}
@keyframes credit-enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes medal-pop { from { opacity: 0; transform: scale(0.95) rotate(-12deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
@keyframes firework {
  0% { opacity: 0; transform: translate(-50%, -50%); }
  18%, 55% { opacity: 1; }
  100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(80deg); }
}
@media (max-width: 550px) {
  .route-options { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .split { grid-template-columns: 1fr; }
  .fields { grid-template-columns: minmax(0, 1fr); }
  .timeline { grid-template-columns: minmax(0, 1fr); }
  .momentum, .credit-stats { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
  .actions .rc-btn--primary, .actions .rc-btn--gold { flex: 1 1 100%; }
}
.victory-banner { margin-top: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
</style>
</head>
<body>
<main>
<header><p class="rc-wordmark"><!-- MARK --><span>Relo<b>Cat</b></span></p><span class="rc-pill rc-pill--violet" data-i18n="pill">Hackathon · fictional data</span>
<div class="rc-lang" id="languages" role="group" aria-label="Language"><button type="button" data-lang="en" lang="en" aria-pressed="true">English</button><button type="button" data-lang="ca" lang="ca" aria-pressed="false">Català</button><button type="button" data-lang="es" lang="es" aria-pressed="false">Castellano</button></div></header>
<div class="pair"><span><!-- ICON:pulse --> <span id="connection">Starting live board</span></span><a id="board-link" target="_blank" rel="noopener noreferrer" hidden><span data-i18n="openBoard">Open browser board</span><!-- ICON:external --></a></div>
<nav class="nav" id="personas" aria-label="Demo personas" data-i18n-aria-label="personas"></nav>
<div id="status" role="status" aria-live="polite"></div>
<div id="view" aria-live="polite"><p data-i18n="loading">Loading the demo…</p></div>
<footer class="footer" id="controls" hidden>
<span data-i18n="footer">Demo estimates use sample inputs in EUR.</span>
<div><button type="button" class="rc-btn rc-btn--quiet rc-btn--sm" data-action="restart_persona" data-i18n="resetPersona">Reset persona</button><button type="button" class="rc-btn rc-btn--quiet rc-btn--sm" data-action="restart_all" data-i18n="resetAll">Reset all four</button><button type="button" class="rc-btn rc-btn--quiet rc-btn--sm" id="fullscreen" hidden>Expand</button></div>
</footer>
</main>
<!-- WIDGET -->
</body>
</html>
