<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReloCat homebuying interview</title>
<style>
  /* THEME */
  /* ART */
  /* The interview card shown inside a chat: a night panel of the shared theme, as the interview page is. The page
     pins the dark scheme so every --rc-* token takes its dark value, and gold is the one accent. The content sets
     the height: nothing here is sized to the window. */
  :root {
    color-scheme: dark;
    --rc-body-size: 0.9375rem;
    --rc-paper: var(--rc-night);
    --rc-surface: var(--rc-night-2);
    --rc-ink: var(--rc-on-night);
    --rc-muted: var(--rc-on-night-muted);
    --rc-focus: var(--rc-gold);
    --veil: rgb(255 255 255 / 0.07);
  }
  html { background: var(--rc-night); }
  body { background: linear-gradient(135deg, var(--rc-night), var(--rc-night-2)); text-align: center; overflow-wrap: anywhere; }
  main { max-width: 38rem; margin: auto; padding: 24px 20px 16px; }
  h1 { font-size: var(--rc-text-2xl); line-height: 1.2; text-wrap: balance; }
  h2 { font-size: var(--rc-text-md); line-height: 1.3; }
  p { margin: 8px auto 0; max-width: 30rem; }
  strong { font-weight: var(--rc-weight-semibold); }
  .hint { color: var(--rc-muted); font-size: var(--rc-text-sm); }
  .intro { color: var(--rc-muted); text-wrap: balance; }

  /* The orb says what the conversation is doing: still when idle, moving while someone speaks. */
  .orb {
    display: grid; place-items: center; width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 50%;
    background: radial-gradient(circle at 35% 25%, #fff6c4, var(--rc-gold) 55%, #d9a93c);
    box-shadow: 0 0 28px color-mix(in srgb, var(--rc-gold) 45%, transparent); color: var(--rc-gold-ink);
  }
  .orb .rc-icon { width: 32px; height: 32px; }
  [data-voice="hearing"] .orb, [data-voice="speaking"] .orb { animation: orb 0.9s ease-in-out infinite alternate; }
  [data-voice="connecting"] .orb, [data-voice="thinking"] .orb { animation: wait 0.9s ease-in-out infinite alternate; }
  [data-voice="muted"] .orb { opacity: 0.55; }
  @keyframes orb { from { transform: scale(0.94); } to { transform: scale(1.08); } }
  @keyframes wait { from { opacity: 0.5; } to { opacity: 1; } }

  /* The trail of checkpoints: the one to work on, with its illustration, and how many are reached. */
  .trail { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 16px auto 0; text-align: left; }
  .trail-art { flex: none; width: 48px; height: 48px; border-radius: var(--rc-radius-md); background: var(--veil) center / cover no-repeat; }
  .trail-art[data-step="step-profile"] { background-image: var(--rc-art-step-profile); }
  .trail-art[data-step="step-money"] { background-image: var(--rc-art-step-money); }
  .trail-art[data-step="step-bank"] { background-image: var(--rc-art-step-bank); }
  .trail-art[data-step="step-places"] { background-image: var(--rc-art-step-places); }
  .trail-art[data-step="step-aid"] { background-image: var(--rc-art-step-aid); }
  .trail-art[data-step="step-habits"] { background-image: var(--rc-art-step-habits); }
  .trail-art[data-step="step-ready"] { background-image: var(--rc-art-step-ready); }
  .trail p { display: grid; gap: 2px; margin: 0; }
  .trail ol { display: flex; gap: 4px; margin: 4px 0 0; padding: 0; list-style: none; }
  .trail li { width: 16px; height: 4px; border-radius: 2px; background: var(--rc-line-strong); }
  .trail li[data-state="done"] { background: var(--rc-gold); }
  .trail li[data-state="current"] { background: var(--rc-on-night); }
  .trail li[data-state="unknown"] { opacity: 0.5; }

  #voice-status { min-height: 1.5em; margin-top: 16px; color: var(--rc-muted); }
  .actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; }
  .rc-btn[aria-pressed="true"] { border-color: var(--rc-gold); background: var(--rc-gold-soft); color: var(--rc-ink); box-shadow: inset 0 0 0 1px var(--rc-gold); }
  .rc-btn.end { border-color: var(--rc-danger); color: var(--rc-danger); }
  .rc-btn--quiet { color: var(--rc-gold); }
  @media (hover: hover) {
    .rc-btn.end:hover:not(:disabled) { border-color: var(--rc-danger); background: var(--rc-danger-soft); color: var(--rc-danger); }
  }

  /* What ReloCat just said, for a chat with the sound off. */
  #last-question { margin-top: 16px; padding: 12px 16px; border-radius: var(--rc-radius-md); background: var(--veil); color: var(--rc-ink); text-align: left; }

  /* The typed reply: the label above its field, a 16 px field and 44 px targets. */
  #typed-answer { display: flex; flex-wrap: wrap; align-items: end; gap: 8px; max-width: 30rem; margin: 12px auto 0; }
  #typed-answer label { flex-basis: 100%; color: var(--rc-muted); font-size: var(--rc-text-sm); font-weight: var(--rc-weight-semibold); text-align: left; }
  #typed-answer input {
    flex: 1 1 160px; min-width: 0; min-height: var(--rc-control); padding: 8px 12px;
    border: 1px solid var(--rc-line-strong); border-radius: var(--rc-radius-sm);
    background: var(--rc-sunken); color: var(--rc-ink); font: inherit; font-size: 1rem;
  }

  .plan { max-width: 30rem; margin: 16px auto 0; padding: 12px 16px; border-radius: var(--rc-radius-md); background: var(--veil); text-align: left; }
  .plan p { max-width: none; }
  .plan h2 { color: var(--rc-muted); font-size: var(--rc-text-sm); }
  .plan h3 { margin-top: 12px; color: var(--rc-muted); font-size: var(--rc-text-sm); }
  .plan ul { margin: 4px 0 0; padding-left: 20px; }
  .plan .plan-headline { font-weight: var(--rc-weight-semibold); }
  .plan .actions { justify-content: flex-start; }

  .notice { margin-top: 12px; }
  .rc-lang { justify-content: center; margin-top: 8px; }
  @media (hover: hover) {
    .rc-lang button:hover { background: color-mix(in srgb, var(--rc-on-night) 14%, transparent); color: var(--rc-on-night); }
  }
  @media (max-width: 420px) {
    main { padding-inline: 16px; }
    .actions .rc-btn, #typed-answer .rc-btn { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<main id="card" data-voice="idle" aria-labelledby="title">
  <div class="orb" aria-hidden="true"><!-- ICON:mic --></div>
  <h1 id="title" data-i18n="heading">Your homebuying interview</h1>
  <p class="intro" data-i18n="intro">Talk it through here, in this card. ReloCat asks one question at a time.</p>
  <div id="trail" class="trail" role="group" aria-label="Your journey" hidden>
    <span id="trail-art" class="trail-art" aria-hidden="true"></span>
    <div><p><strong id="trail-title"></strong><span id="trail-count" class="hint"></span></p><ol id="trail-steps" aria-hidden="true"></ol></div>
  </div>
  <p id="voice-status" role="status">Ready when you are. Your microphone is asked for when you start.</p>
  <div class="actions">
    <button id="start" type="button" class="rc-btn rc-btn--gold" data-say="start">Start talking</button>
    <button id="type-instead" type="button" class="rc-btn" data-i18n="typeInstead" hidden>Answer by typing</button>
    <button id="mute" type="button" class="rc-btn" aria-pressed="false" hidden>Mute mic</button>
    <button id="stop" type="button" class="rc-btn end" data-say="end" hidden>End conversation</button>
  </div>
  <p id="last-question" aria-live="polite" hidden></p>
  <form id="typed-answer" hidden>
    <label for="answer" data-say="typeReply">Type a reply</label>
    <input id="answer" type="text" autocomplete="off" enterkeyhint="send" maxlength="1000" required>
    <button id="send-answer" class="rc-btn" data-say="sendAnswer" disabled>Send answer</button>
  </form>
  <section id="plan" class="plan" aria-labelledby="plan-heading" hidden>
    <h2 id="plan-heading" data-i18n="planHeading">Your plan so far</h2>
    <div id="plan-body" aria-live="polite"></div>
    <div class="actions"><button id="workspace" type="button" class="rc-btn" data-say="openWorkspace">Open the workspace</button></div>
    <p id="workspace-status" class="hint" role="status" hidden></p>
  </section>
  <p id="notice" class="hint notice" role="status" hidden></p>
  <div class="actions">
    <button id="continue" type="button" class="rc-btn rc-btn--quiet" data-i18n="continueInChat">Continue in the chat instead</button>
  </div>
  <p id="chat-status" class="hint" role="status" hidden></p>
  <p id="voice-note" class="hint" data-i18n="voiceNote">Voice uses your microphone and sends what you say to OpenAI.</p>
  <div class="rc-lang" id="languages" role="group" aria-label="Language"><button type="button" data-lang="en" lang="en" aria-pressed="true">English</button><button type="button" data-lang="ca" lang="ca" aria-pressed="false">Català</button><button type="button" data-lang="es" lang="es" aria-pressed="false">Castellano</button></div>
  <audio id="audio" autoplay></audio>
</main>
<!-- WIDGET -->
</body>
</html>
