<style>
  html[data-savings-widget] { color-scheme: light dark; }
  html[data-savings-widget] body { margin: 0; padding: 12px; font: 1rem/1.55 system-ui, sans-serif; }
  .savings-coach {
    --coach-paper: light-dark(#fffbf4, #172820);
    --coach-panel: light-dark(#e9f0e4, #223b2e);
    --coach-ink: light-dark(#173b2b, #e8f2e7);
    --coach-muted: light-dark(#45614f, #bfd3c4);
    --coach-line: light-dark(#c7d3c5, #466351);
    --coach-accent: light-dark(#124c36, #b5e4c2);
    --coach-on-accent: light-dark(#fffdf6, #10291c);
    color: var(--coach-ink);
    background: var(--coach-paper);
    border: 1px solid var(--coach-line);
    border-radius: 16px;
    padding: clamp(18px, 5vw, 44px);
  }
  .savings-coach *, .savings-coach *::before, .savings-coach *::after { box-sizing: border-box; }
  .savings-coach [hidden] { display: none !important; }
  .savings-coach p, .savings-coach dl, .savings-coach dd { margin: 0; }
  .savings-coach .coach-title {
    margin: 0;
    color: var(--coach-ink);
    font: 500 clamp(1.9rem, 4vw, 3rem)/1.07 Georgia, ui-serif, serif;
    letter-spacing: -.035em;
  }
  .savings-coach .coach-intro { margin-top: 8px; color: var(--coach-muted); }
  .savings-coach .coach-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; gap: clamp(22px, 6vw, 54px); margin-top: 26px; }
  .savings-coach .coach-plan { padding: 18px; border-radius: 12px; background: var(--coach-panel); }
  .savings-coach .coach-plan div { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 18px; padding-block: 6px; }
  .savings-coach dd { color: var(--coach-ink); font-weight: 720; text-align: end; font-variant-numeric: tabular-nums; }
  .savings-coach .coach-months { border-top: 1px solid var(--coach-line); margin-top: 8px; padding-top: 12px; }
  .savings-coach .coach-form fieldset { margin: 0; padding: 0; border: 0; min-inline-size: 0; }
  .savings-coach .coach-form label { display: block; font-weight: 690; margin-bottom: 4px; }
  .savings-coach .coach-action { color: var(--coach-muted); font-size: .92rem; margin: 8px 0 15px; }
  .savings-coach .coach-amount { margin-top: 15px; }
  .savings-coach input, .savings-coach select, .savings-coach button {
    min-height: 44px;
    font: inherit;
    border: 1px solid var(--coach-line);
    border-radius: 8px;
    padding: 6px 10px;
  }
  .savings-coach input, .savings-coach select { width: 100%; color: var(--coach-ink); background: var(--coach-paper); }
  .savings-coach input { font-variant-numeric: tabular-nums; }
  .savings-coach button { margin-top: 12px; font-weight: 720; color: var(--coach-on-accent); background: var(--coach-accent); cursor: pointer; }
  .savings-coach button:hover:enabled { background: light-dark(#206549, #c5edcd); }
  .savings-coach button:disabled { opacity: .65; cursor: wait; }
  .savings-coach :focus-visible { outline: 3px solid light-dark(#663e91, #d4b5ed); outline-offset: 3px; }
  .savings-coach .coach-result { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--coach-line); }
  .savings-coach .coach-result strong { display: block; font-size: 1.28rem; font-variant-numeric: tabular-nums; }
  .savings-coach .coach-note, .savings-coach .coach-status { color: var(--coach-muted); font-size: .91rem; margin-top: 12px; }
  .savings-coach .coach-status:empty { margin-top: 0; }
  @media (max-width: 660px) { .savings-coach .coach-layout { grid-template-columns: minmax(0, 1fr); } }
</style>
<section id="savings-coach" class="savings-coach" aria-labelledby="savings-coach-title">
  <h2 class="coach-title" id="savings-coach-title">Savings Coach</h2>
  <p class="coach-intro">Try one habit and see how it could change your home savings timeline. This demo uses fictional data.</p>
  <div class="coach-layout" id="savings-coach-content" hidden>
    <dl class="coach-plan">
      <div><dt>Purchase cash target</dt><dd id="coach-target"></dd></div>
      <div><dt>Already set aside</dt><dd id="coach-saved"></dd></div>
      <div><dt>Left to save</dt><dd id="coach-remaining"></dd></div>
      <div><dt>Monthly contribution</dt><dd id="coach-monthly"></dd></div>
      <div class="coach-months"><dt>At the current pace</dt><dd id="coach-baseline"></dd></div>
    </dl>
    <form class="coach-form" id="coach-form">
      <fieldset id="coach-controls">
        <div id="coach-habits">
          <label for="coach-habit">Choose a habit to try</label>
          <select id="coach-habit" aria-describedby="coach-action"></select>
          <p id="coach-action" class="coach-action"></p>
        </div>
        <div class="coach-amount">
          <label for="coach-extra" id="coach-extra-label">Extra monthly savings</label>
          <input id="coach-extra" type="number" inputmode="decimal" min="0" step="0.01" required aria-describedby="coach-assumption">
        </div>
        <button type="submit">Compare timelines</button>
      </fieldset>
      <p class="coach-note" id="coach-assumption">Use an amount you think you could set aside each month.</p>
      <div class="coach-result" id="coach-result" role="status" hidden>
        <strong id="coach-projection"></strong>
        <p id="coach-difference"></p>
      </div>
    </form>
  </div>
  <p class="coach-status" id="coach-status" role="status">Loading the fictional plan…</p>
</section>
