<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample cash flow</title>
<style>
/* THEME */
  /* Cash-flow card layout. Everything else comes from packages/ui/theme.css. */
  :root { --rc-body-size: 0.9375rem; }
  main { padding: 16px; max-width: 34rem; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h2 { display: flex; align-items: center; gap: 8px; font-size: var(--rc-text-xl); }
  h2 .rc-icon { color: var(--rc-violet); }
  #coverage { margin-top: 4px; color: var(--rc-muted); font-size: var(--rc-text-sm); }
  dl { margin: 12px 0 0; }
  dl div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--rc-line); }
  dl div:last-child { border-bottom: 0; }
  dd { font-variant-numeric: tabular-nums; }
  #totals { font-weight: 700; }
  #totals div:last-child dd { color: var(--rc-accent); }
  #expenses { color: var(--rc-muted); margin-top: 0; }
  details { margin-top: 4px; border-top: 1px solid var(--rc-line); }
</style>
<main>
  <div class="card-head">
    <h2><!-- ICON:wallet -->Sample monthly cash flow</h2>
    <span class="rc-pill rc-pill--violet">Fictional data</span>
  </div>
  <p id="coverage" role="status">Loading fictional transaction summary…</p>
  <dl id="totals"></dl>
  <details id="breakdown" hidden>
    <summary>Spending by category</summary>
    <dl id="expenses"></dl>
  </details>
</main>
<script>
  const byId = id => document.getElementById(id);
  const money = new Intl.NumberFormat(undefined, { style: 'currency', currency: 'EUR' });
  const notify = (method, params) => window.parent.postMessage({ jsonrpc: '2.0', method, params }, '*');

  function renderRows(id, rows) {
    byId(id).replaceChildren(...rows.map(([label, amount]) => {
      const row = document.createElement('div');
      const name = document.createElement('dt');
      const value = document.createElement('dd');
      name.textContent = label;
      value.textContent = Number.isFinite(amount) ? money.format(amount) : 'Unidentified';
      row.append(name, value);
      return row;
    }));
  }

  function render(summary) {
    if (!Array.isArray(summary?.observedMonths) || !summary.monthlyExpenses) return;
    byId('coverage').textContent = summary.observedMonths.length + ' months of fictional transactions';
    renderRows('totals', [
      ['Estimated salary', summary.estimatedMonthlySalary],
      ['Average spending', summary.monthlyCostOfLiving],
      ['Net cash flow', summary.monthlyNetCashFlow],
    ]);
    const labels = { Rent: 'Housing (rent)', 'Eating out': 'Restaurants and takeout' };
    renderRows('expenses', Object.entries(summary.monthlyExpenses).map(([name, amount]) => [labels[name] ?? name, amount]));
    byId('breakdown').hidden = false;
  }

  window.addEventListener('message', event => {
    if (event.source !== window.parent || event.data?.jsonrpc !== '2.0') return;
    const message = event.data;
    if (message.id === 1 && message.result) notify('ui/notifications/initialized', {});
    if (message.id === 1 && message.error) byId('coverage').textContent = 'Cash flow preview is unavailable.';
    if (message.method === 'ui/notifications/tool-result') render(message.params?.structuredContent);
  });
  window.parent.postMessage({
    jsonrpc: '2.0',
    id: 1,
    method: 'ui/initialize',
    params: {
      appInfo: { name: 'Homebuying cash flow', version: '0.1.0' },
      appCapabilities: {},
      protocolVersion: '2026-01-26',
    },
  }, '*');
</script>
</html>
