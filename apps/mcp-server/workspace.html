<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReloCat · Your workspace</title>
<style>
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,input,select{border:1px solid var(--line,#d8cfe2);border-radius:10px;padding:10px 13px}button{cursor:pointer;background:white;color:var(--rc-ink,#23193f);font-weight:650}button:disabled{opacity:.5;cursor:wait}input,select,textarea{background:white;color:var(--rc-ink,#23193f)}a{color:var(--rc-violet,#5738aa)}.ws{max-width:1180px;margin:auto;padding:clamp(14px,3vw,30px)}.ws-header,.ws-row,.ws-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.ws-brand{font-size:24px;font-weight:850;letter-spacing:-.06em}.ws-tag{font-size:14px;border-radius:30px;background:#eee7fa;color:#392960;padding:6px 11px}.ws h1{font-size:clamp(25px,4vw,36px);letter-spacing:-.04em;line-height:1.12;margin:25px 0 8px}.ws h2{font-size:21px;letter-spacing:-.025em;margin:0 0 8px}.ws p{color:var(--muted,#574e68);line-height:1.6}.ws-nav{display:flex;gap:6px;overflow:auto;padding:20px 0}.ws-nav button{white-space:nowrap}.ws-nav button[aria-selected=true]{background:#23193f;color:white;border-color:#23193f}.ws-status{border-radius:11px;background:#eee7fa;color:#392960;padding:12px 16px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;margin:0 0 18px}.ws-status.error{background:#fbe7ec;color:#8e2d40}.ws-status.success{background:#e2f3e9;color:#17563b}.ws-grid{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px}.ws-people,.ws-main{background:white;border:1px solid #d8cfe2;border-radius:16px;padding:20px;min-width:0}.ws-people label,.ws-form label,.ws-control{display:grid;gap:7px;font-size:14px;font-weight:600;color:#574e68}.ws-people input{width:100%}.ws-user-list{display:flex;flex-direction:column;gap:4px;max-height:420px;overflow:auto;margin:14px 0}.ws-user-list button{text-align:left;border-color:transparent;font-size:14px;padding:8px 10px}.ws-user-list button[aria-pressed=true]{background:#eee7fa;color:#5738aa;border-color:#d9caff}.ws-main>fieldset{border:0;margin:0;padding:0;min-width:0}.ws-toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:20px 0 14px}.ws-toolbar label{flex:1;min-width:140px}.ws-toolbar label select{width:100%}.ws-meta{color:#574e68;font-size:14px}.ws-editor{width:100%;min-height:340px;resize:vertical;border:1px solid #d8cfe2;border-radius:12px;padding:16px;font:14px/1.6 ui-monospace,Consolas,monospace;background:#fcfaff;tab-size:2}.ws-editor[readonly]{background:#f6f3fb}.ws-actions{justify-content:flex-start;margin:14px 0}.ws-actions input[type=file]{max-width:220px;padding:6px;font-size:14px}.ws-notice{font-size:14px;line-height:1.6;background:#e2f3e9;border-left:3px solid #b9e5cb;padding:12px 15px;margin-top:20px;color:#17563b}.ws-empty{text-align:center;padding:50px 20px;color:#574e68}.ws-count{font-variant-numeric:tabular-nums}.ws-dirty{font-size:14px;color:#72420c}.ws-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:20px 0}.ws-form label input,.ws-form label select{width:100%}.ws-full{grid-column:1/-1}.ws-check{display:flex!important;align-items:center;gap:8px}.ws-check input{width:auto!important}.ws-modal-backdrop{position:fixed;inset:0;display:grid;place-items:center;background:#23193f80;z-index:100;padding:20px}.ws-modal{background:#fff;border-radius:18px;padding:24px;max-width:460px;box-shadow:0 20px 80px #23193f40}.ws-town-source{display:flex;gap:10px;flex-wrap:wrap}.ws-result{background:#fcfaff;border:1px solid #d8cfe2;border-radius:12px;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.6 ui-monospace,Consolas,monospace;max-height:500px;overflow:auto}.ws-input-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0}.ws-input-head label{font-size:14px}.ws-input-head select{margin-left:6px}.ws-footer{color:#574e68;font-size:14px;margin:20px 0 0}.ws button.danger{color:#8e2d40}.ws small{font-size:14px}.ws-refresh{margin-left:auto}.ws-retry{margin-top:10px}@media(max-width:730px){.ws-grid{display:block}
