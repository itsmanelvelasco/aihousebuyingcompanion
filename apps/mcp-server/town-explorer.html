<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReloCat Town Explorer</title>
  <style>
/* THEME */
    /* ART */
    /* Town Explorer layout. Colours, type and components come from packages/ui/theme.css. */
    :root { --rc-body-size: 0.9375rem; }
    main { max-width: 1120px; padding: 16px; margin: auto; }
    h2 { font-size: var(--rc-text-2xl); }
    a { overflow-wrap: anywhere; }
    .muted { color: var(--rc-muted); }
    .hero {
      position: relative;
      isolation: isolate;
      display: grid;
      align-items: center;
      min-height: 212px;
      padding: 24px 28px;
      border: 1px solid var(--rc-line);
      border-radius: var(--rc-radius-lg);
      overflow: hidden;
      background: var(--rc-day);
      color: var(--rc-on-day);
      /* A fixed cream panel: the wordmark inside resolves the light half of the theme tokens. */
      color-scheme: light;
    }
    .hero-art {
      position: absolute;
      z-index: -1;
      inset: 0 0 0 auto;
      width: 65%;
      height: 100%;
      background: var(--rc-art-hero-valley) 58% 66% / cover no-repeat;
      mask-image: linear-gradient(to right, transparent, #000 24%);
    }
    .hero h1 { max-width: 10ch; margin: 8px 0; font-size: clamp(var(--rc-text-3xl), 1.25rem + 3.75vw, var(--rc-text-4xl)); color: var(--rc-on-day); }
    .hero .intro { max-width: 25ch; color: var(--rc-on-day-muted); }
    /* The language switcher sits over the illustration on a pill of the surface colour. */
    .hero .rc-lang {
      position: absolute;
      top: 8px;
      right: 8px;
      flex-wrap: nowrap;
      padding-inline: 4px;
      border-radius: var(--rc-radius-sm);
      background: color-mix(in srgb, var(--rc-surface) 92%, transparent);
    }
    .hero .rc-lang:empty { display: none; }
    .explorer { margin-top: 24px; }
    .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; margin-bottom: 12px; }
    .section-label { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
    #count { color: var(--rc-muted); font-size: var(--rc-text-sm); white-space: nowrap; }
    /* Segmented control: which towns the map and the list show. */
    .views { display: flex; gap: 4px; padding: 4px; background: var(--rc-violet-soft); border-radius: var(--rc-radius-md); }
    .views button {
      position: relative;
      min-height: 36px;
      padding: 4px 12px;
      border: 1px solid transparent;
      border-radius: var(--rc-radius-sm);
      background: transparent;
      color: var(--rc-violet);
      font-size: var(--rc-text-sm);
      font-weight: 700;
      transition: background-color var(--rc-dur-fast) var(--rc-ease), transform var(--rc-dur-fast) var(--rc-ease);
    }
    /* The 36 px segments keep a 44 px touch target through the padding of the group. */
    .views button::after { content: ""; position: absolute; inset: -4px 0; }
    .views button:active { transform: scale(0.97); }
    .views button[aria-pressed="true"] { background: var(--rc-surface); border-color: var(--rc-line); box-shadow: var(--rc-shadow-sm); }
    @media (hover: hover) { .views button:hover { background: var(--rc-surface); } }
    .workspace { display: grid; grid-template-columns: minmax(0, 1.48fr) minmax(0, 1fr); align-items: start; gap: 12px; }
    .map-shell { min-width: 0; border: 1px solid var(--rc-line); background: #ece8f3; border-radius: var(--rc-radius-lg); overflow: hidden; }
    /* The map is drawn on a fixed light canvas, so its controls keep light colours in both themes. */
    .map { height: 342px; position: relative; color-scheme: light; color: var(--rc-ink); touch-action: manipulation; }
    .map canvas, #map-pins { position: absolute; inset: 0; width: 100%; height: 100%; }
    #map-pins { pointer-events: none; }
    .map-controls { position: absolute; z-index: 4; top: 8px; right: 8px; display: grid; justify-items: end; gap: 4px; }
    .map-controls button {
      position: relative;
      display: inline-grid;
      place-items: center;
      min-width: 36px;
      min-height: 36px;
      padding: 0 8px;
      border: 1px solid var(--rc-line-strong);
      border-radius: var(--rc-radius-sm);
      background: var(--rc-surface);
      color: var(--rc-accent);
      font-size: var(--rc-text-sm);
      font-weight: 700;
    }
    .map-controls button::after { content: ""; position: absolute; inset: -4px; }
    .map-controls button:disabled { opacity: 0.45; }
    .map-controls button:active:not(:disabled) { transform: scale(0.96); }
    @media (hover: hover) { .map-controls button:hover:enabled { background: var(--rc-accent-soft); } }
    .map-controls .zoom { display: flex; gap: 4px; }
    .map-key {
      position: absolute;
      z-index: 1;
      top: 12px;
      left: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 8px;
      border-radius: var(--rc-radius-sm);
      background: color-mix(in srgb, var(--rc-surface) 92%, transparent);
      color: var(--rc-on-day-muted);
      font-size: var(--rc-text-xs);
      font-weight: 800;
      pointer-events: none;
    }
    .north { display: inline-block; width: 0; height: 0; border-inline: 4px solid transparent; border-bottom: 8px solid currentColor; }
    figcaption { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 8px; padding: 8px 12px; background: var(--rc-surface); color: var(--rc-muted); font-size: var(--rc-text-xs); border-top: 1px solid var(--rc-line); }
    #map-selection { color: var(--rc-violet); font-weight: 700; }
    .map-pin {
      position: absolute;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #462b6b;
      transform: translate(-50%, -50%);
      pointer-events: auto;
    }
    /* The rank marker: a pin-shaped badge shared by the map, the town list and the workspace. */
    .pin-marker, .rank {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      border-radius: 50% 50% 50% 9px;
      background: #e9d6fb;
      color: #502e79;
      font-size: var(--rc-text-sm);
      font-weight: 800;
      line-height: 1;
    }
    .pin-marker { border: 2px solid #fffcf5; box-shadow: 0 2px 4px #41295c38; }
    .pin-marker:empty { width: 16px; height: 16px; background: #7950a7; }
    .map-pin:focus-visible, .map-pin[aria-pressed="true"] { z-index: 3; }
    @media (hover: hover) { .map-pin:hover { z-index: 3; } }
    .map-pin[aria-pressed="true"] .pin-marker, .town-card[aria-pressed="true"] .rank { background: var(--rc-gold); color: var(--rc-gold-ink); }
    .results { min-width: 0; }
    .town-list { list-style: none; padding: 0 4px 4px; margin: 0 -4px; display: grid; gap: 8px; max-height: 367px; overflow: auto; scrollbar-color: var(--rc-line-strong) transparent; }
    .town-card {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      text-align: start;
      width: 100%;
      min-height: 76px;
      border: 1px solid var(--rc-line);
      border-radius: var(--rc-radius-md);
      padding: 12px;
      background: var(--rc-surface);
      transition: background-color var(--rc-dur-fast) var(--rc-ease), border-color var(--rc-dur-fast) var(--rc-ease), transform var(--rc-dur-fast) var(--rc-ease);
    }
    .town-card[aria-pressed="true"] { border-color: var(--rc-violet); background: var(--rc-violet-soft); }
    @media (hover: hover) { .town-card:hover { border-color: var(--rc-violet); background: var(--rc-violet-soft); } }
    .town-card:active { transform: scale(0.99); }
    .town-card strong, .town-card small { display: block; overflow-wrap: anywhere; }
    .town-card strong { font: 700 var(--rc-text-lg) / 1.15 var(--rc-font-display); }
    .town-card .region { margin-top: 4px; }
    .town-card .highlight { margin-top: 4px; color: var(--rc-accent); font-weight: 700; line-height: 1.35; }
    .town-card .access { margin-top: 4px; line-height: 1.35; }
    .card-arrow { width: 7px; height: 7px; border: solid var(--rc-violet); border-width: 2px 2px 0 0; transform: rotate(45deg); margin-right: 4px; }
    .chooser { margin: 0 0 8px; color: var(--rc-muted); }
    .panel-message.hint { padding: 0 0 8px; border: 0; background: transparent; color: var(--rc-muted); font-size: var(--rc-text-sm); }
    .panel-message + .rc-btn { margin-top: 8px; }
    .snapshot { margin-top: 8px; color: var(--rc-muted); font-size: var(--rc-text-xs); }
    #status { color: var(--rc-muted); margin-top: 12px; }
    #status:empty { display: none; }
    #profile { margin-top: 24px; scroll-margin-top: 8px; }
    #profile:empty { display: none; }
    .overview {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, .65fr);
      gap: 16px;
      padding: 16px;
      border: 1px solid var(--rc-line);
      border-radius: var(--rc-radius-lg);
      background: var(--rc-surface);
      align-items: center;
    }
    .overview h2 { font-size: var(--rc-text-3xl); line-height: 1.25; overflow-wrap: anywhere; }
    .overview p { margin-top: 4px; }
    .metric { border-radius: var(--rc-radius-sm); padding: 12px; background: var(--rc-gold-soft); color: var(--rc-warn); }
    .metric small { color: inherit; }
    .metric strong { display: block; margin: 4px 0; font-size: var(--rc-text-xl); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--rc-ink); }
    .evidence { margin-top: 24px; }
    .evidence h3 { display: flex; align-items: center; gap: 8px; font-size: var(--rc-text-lg); }
    .evidence h3 .rc-icon { color: var(--rc-violet); }
    .evidence p { margin-top: 4px; max-width: var(--rc-measure); }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { padding: 8px; text-align: start; border-bottom: 1px solid var(--rc-line); vertical-align: top; }
    thead th { font-size: var(--rc-text-sm); color: var(--rc-muted); }
    tbody th { width: 46%; font-weight: 600; }
    td { font-variant-numeric: tabular-nums; }
    td small, .items small { display: block; }
    .panels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 24px; }
    .items { list-style: none; margin: 4px 0 0; padding: 0; }
    .items li { padding: 8px 0; border-bottom: 1px solid var(--rc-line); overflow-wrap: anywhere; }
    .match-list { margin: 4px 0 0; padding-left: 20px; }
    details { margin-top: 8px; }
    @media (min-width: 900px) {
      main { padding: 24px; }
      .hero { padding-inline: 36px; min-height: 232px; }
    }
    @media (max-width: 630px) {
      /* Too narrow to share a line with the wordmark: the switcher follows the text. */
      .hero .rc-lang { position: static; justify-self: start; margin-top: 8px; margin-inline-start: -4px; }
      .workspace, .panels { grid-template-columns: minmax(0, 1fr); }
      .map { height: 276px; }
      .town-list { max-height: 290px; }
    }
    @media (max-width: 420px) {
      main { padding: 12px; }
      .hero { min-height: 172px; padding: 16px; }
      .hero .intro { font-size: var(--rc-text-sm); max-width: 17ch; }
      .hero-art { width: 62%; background-position: 54% 65%; }
      .map { height: 242px; }
      .overview { grid-template-columns: minmax(0, 1fr); gap: 12px; }
    }
</style>
</head>
<body>
  <main>
    <header class="hero">
      <div class="hero-art" aria-hidden="true"></div>
      <div>
        <p class="rc-wordmark"><!-- MARK --><span>Relo<b>Cat</b></span></p>
        <h1 data-i18n="heroTitle">Find your town</h1>
        <p class="intro" data-i18n="heroIntro">Compare places to live in Catalonia.</p>
      </div>
      <div class="rc-lang" id="languages"></div>
    </header>
    <section class="explorer" aria-labelledby="results-title">
      <div class="toolbar">
        <div class="section-label"><h2 id="results-title">Explore Catalonia</h2><span id="count"></span></div>
        <div class="views" role="group" aria-label="Towns to display" data-i18n-attr="aria-label:townsToDisplay" hidden>
          <button id="show-results" type="button" aria-pressed="false" data-i18n="results">Results</button>
          <button id="show-all" type="button" aria-pressed="false" data-i18n="allTowns">All towns</button>
        </div>
      </div>
      <div class="workspace">
        <figure class="map-shell" aria-label="Map of the Catalonia pilot" data-i18n-attr="aria-label:mapLabel">
          <div id="map" class="map">
            <canvas aria-hidden="true"></canvas>
            <div class="map-key"><span class="north" aria-hidden="true"></span><span data-i18n="mapKey">Catalonia</span></div>
            <div id="map-pins" role="group" aria-label="Town map pins" data-i18n-attr="aria-label:mapPins"></div>
            <div class="map-controls" role="group" aria-label="Map controls" data-i18n-attr="aria-label:mapControls">
              <div class="zoom">
                <button id="zoom-out" type="button" aria-label="Zoom out" data-i18n-attr="aria-label:zoomOut" disabled><!-- ICON:remove --></button>
                <button id="zoom-in" type="button" aria-label="Zoom in" data-i18n-attr="aria-label:zoomIn" disabled><!-- ICON:add --></button>
              </div>
              <button id="fit-map" type="button" disabled>Fit towns</button>
            </div>
          </div>
          <figcaption><span id="map-credit">Boundaries adapted from <a id="map-source" target="_blank" rel="noopener noreferrer">ICGC</a> · <a id="map-license" target="_blank" rel="noopener noreferrer">CC BY 4.0</a></span><span id="map-selection"></span></figcaption>
        </figure>
        <div class="results">
          <label class="chooser rc-field" for="town" hidden><span data-i18n="jumpTo">Jump to a municipality</span>
            <select id="town" disabled><option value="" data-i18n="chooseTown">Choose a town</option></select>
          </label>
          <p id="results-status" class="panel-message rc-note" role="status">Loading towns…</p>
          <button id="retry-results" class="rc-btn rc-btn--sm" type="button" hidden><!-- ICON:refresh --><span data-i18n="retry">Retry</span></button>
          <ol id="town-list" class="town-list" aria-label="Town cards" data-i18n-attr="aria-label:townCards"></ol>
          <p id="snapshot" class="snapshot"></p>
        </div>
      </div>
      <p id="status" role="status"></p>
      <div id="profile" aria-label="Selected town details" data-i18n-attr="aria-label:townDetails"></div>
    </section>
    <noscript><!-- NOSCRIPT --></noscript>
  </main>
  <!-- WIDGET -->
</body>
</html>
