<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relocat Town Explorer</title>
  <style>
    :root {
      color-scheme: light dark;
      --text: #172620;
      --muted: #54645b;
      --surface: #fff;
      --soft: #f1f6f2;
      --line: #d6e0d9;
      --accent: #1d684b;
      font: 15px/1.45 system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) { :root { color-scheme: dark; } }
    :root[data-theme="dark"] { color-scheme: dark; }
    :root[data-theme="light"] { color-scheme: light; }
    :root {
      --text: light-dark(#172620, #e8f3eb);
      --muted: light-dark(#54645b, #a9bdb0);
      --surface: light-dark(#fff, #18241e);
      --soft: light-dark(#f1f6f2, #22342a);
      --line: light-dark(#d6e0d9, #43554a);
      --accent: light-dark(#1d684b, #91dab2);
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text); background: var(--surface); }
    main { max-width: 860px; margin: auto; padding: clamp(16px, 4vw, 32px); }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 1.25rem; font-weight: 700; }
    h2 { font-size: clamp(1.75rem, 7vw, 2.55rem); line-height: 1.1; letter-spacing: -.04em; overflow-wrap: anywhere; }
    h3 { font-size: 1.05rem; }
    a { color: var(--accent); text-underline-offset: 3px; overflow-wrap: anywhere; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    header { display: flex; flex-wrap: wrap; align-items: end; gap: 12px 24px; justify-content: space-between; }
    label { display: grid; gap: 4px; font-size: .83rem; font-weight: 650; }
    select { width: 100%; min-height: 40px; padding: 7px; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; font: inherit; }
    .chooser { flex: 0 1 255px; max-width: 100%; }
    .brand { margin-bottom: 2px; color: var(--accent); font-weight: 700; }
    .muted, small { color: var(--muted); font-size: .85rem; }
    #status { color: var(--muted); margin-top: 14px; }
    #status:empty { margin: 0; }
    .overview { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .82fr); gap: 16px; margin-top: 19px; padding: 17px; border: 1px solid var(--line); border-radius: 14px; background: var(--soft); }
    .overview p { margin-top: 6px; }
    .metric { align-self: center; border-inline-start: 1px solid var(--line); padding-inline-start: 16px; }
    .metric strong { display: block; margin: 3px 0; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
    section { margin-top: 21px; }
    section > p { margin-top: 5px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 8px 6px; text-align: start; border-bottom: 1px solid var(--line); vertical-align: top; }
    thead th { font-size: .82rem; color: var(--muted); }
    tbody th { width: 48%; font-weight: 600; }
    td { font-variant-numeric: tabular-nums; }
    td small { display: block; }
    .panels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .items { list-style: none; margin: 7px 0 0; padding: 0; }
    .items li { padding: 9px 0; border-bottom: 1px solid var(--line); }
    .items small { display: block; }
    details { margin-top: 10px; }
    summary { cursor: pointer; color: var(--accent); font-weight: 650; padding: 5px 0; }
    @media (max-width: 520px) {
      .panels { grid-template-columns: minmax(0, 1fr); gap: 0; }
    }
    @media (max-width: 380px) {
      .overview { grid-template-columns: minmax(0, 1fr); }
      .metric { padding: 10px 0 0; border-inline-start: 0; border-top: 1px solid var(--line); }
      th, td { padding-inline: 4px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="brand">Relocat</p>
        <h1>Town Explorer</h1>
      </div>
      <label class="chooser" for="town">Municipality
        <select id="town" disabled><option value="">Choose a town</option></select>
      </label>
    </header>
    <p id="status" role="status">Loading municipalities…</p>
    <div id="profile"></div>
    <noscript>JavaScript is required to browse the town profiles.</noscript>
  </main>
  <!-- WIDGET -->
</body>
</html>
