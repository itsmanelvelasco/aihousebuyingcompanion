<!doctype html>
<html lang="{{language}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{copy.pageTitle}}</title>
  <style>
    :root {
      color-scheme: light dark;
      --paper: light-dark(#fbf6eb, #202720);
      --card: light-dark(#fffcf5, #2b342c);
      --ink: light-dark(#24362b, #f7f3e6);
      --muted: light-dark(#566257, #c1cabd);
      --line: light-dark(#dedbce, #566155);
      --forest: light-dark(#185e41, #9de2ba);
      --violet: light-dark(#623c91, #dfc6ff);
      --lilac: light-dark(#eee3f7, #3d304e);
      --sand: light-dark(#fff0b9, #51431e);
      font: 15px/1.48 ui-sans-serif, system-ui, sans-serif;
    }
    :root[data-theme="dark"] { color-scheme: dark; }
    :root[data-theme="light"] { color-scheme: light; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; color: var(--ink); background: var(--paper); }
    main { max-width: 1120px; padding: 16px; margin: auto; }
    h1, h2, h3, p, figure { margin: 0; }
    h2 { font-size: 1.45rem; line-height: 1.15; letter-spacing: -.035em; }
    h3 { font-size: 1.04rem; }
    a { color: var(--forest); text-underline-offset: 3px; overflow-wrap: anywhere; }
    button, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .45; }
    :focus-visible { outline: 3px solid var(--violet); outline-offset: 3px; }
    ::selection { background: var(--lilac); color: var(--ink); }
    .muted, small { color: var(--muted); }
    small { font-size: .83rem; }
    .hero {
      position: relative;
      isolation: isolate;
      display: grid;
      align-items: center;
      min-height: 210px;
      padding: 26px 28px;
      border: 1px solid #ecddbc;
      border-radius: 16px;
      overflow: hidden;
      background: #fbefdc;
      color: #203d2c;
    }
    .hero-art {
      position: absolute;
      z-index: -1;
      inset: 0 0 0 auto;
      width: 65%;
      height: 100%;
      background-size: cover;
      background-position: 58% 66%;
      mask-image: linear-gradient(to right, transparent, #000 24%);
    }
    .brand { width: max-content; color: #125d3d; font-size: 1.06rem; font-weight: 850; letter-spacing: -.04em; }
    .brand span { color: #714499; }
    .hero h1 {
      max-width: 10ch;
      margin: 6px 0;
      font: 700 3.4rem/.96 ui-serif, Georgia, serif;
      letter-spacing: -.038em;
      text-wrap: balance;
    }
    .hero .intro { max-width: 25ch; color: #3a5545; font-size: .94rem; }
    .preview-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 12px; font-size: .88rem; }
    .explorer { margin-top: 22px; }
    .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 16px; justify-content: space-between; margin-bottom: 11px; }
    .section-label { display: flex; flex-wrap: wrap; align-items: baseline; gap: 5px 9px; }
    #count { color: var(--muted); font-size: .87rem; white-space: nowrap; }
    .views { display: flex; gap: 4px; padding: 3px; background: var(--lilac); border-radius: 10px; }
    .views button, .retry { min-height: 34px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--violet); padding: 4px 9px; font-size: .84rem; font-weight: 730; }
    .views button[aria-pressed="true"], .views button:hover, .retry:hover { background: var(--card); border-color: var(--line); }
    .retry { border-color: var(--line); background: var(--lilac); }
    .property-examples .retry { min-height: 44px; margin-block: 8px; }
    .property-examples [role="status"]:empty { display: none; }
    .listing-heading, .listing-links { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
    .listing-links { font-size: .9rem; }
    .listing-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 232px), 1fr));
      gap: 10px;
      list-style: none;
      padding: 0;
      margin: 10px 0 0;
    }
    .listing-card { display: grid; align-content: start; gap: 3px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
    .listing-card a { font-weight: 680; }
    .listing-card p { margin: 0; }
    .listing-price { font-size: 1.35rem; line-height: 1.15; font-variant-numeric: tabular-nums; }
    .listing-facts, .listing-note { color: var(--muted); font-size: .87rem; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1.48fr) minmax(0, 1fr); align-items: start; gap: 12px; }
    .map-shell { min-width: 0; border: 1px solid #bfc8b0; background: #ece8f3; border-radius: 14px; overflow: hidden; }
    .map {
      height: 342px;
      position: relative;
      color-scheme: light;
      color: #302c42;
      touch-action: manipulation;
    }
    .map canvas, #map-pins { position: absolute; inset: 0; width: 100%; height: 100%; }
    #map-pins { pointer-events: none; }
    .map-controls { position: absolute; z-index: 4; top: 9px; right: 9px; display: grid; justify-items: end; gap: 5px; }
    .map-controls button {
      min-width: 34px;
      min-height: 34px;
      padding: 0 6px;
      border: 1px solid #c7c0cd;
      border-radius: 8px;
      background: #fffcf6;
      font-weight: 750;
    }
    .map-controls button:hover:enabled { background: #eee3f7; }
    .map-controls .zoom { display: flex; gap: 3px; }
    #fit-map { font-size: .8rem; }
    .map-key {
      position: absolute;
      z-index: 1;
      top: 12px;
      left: 11px;
      color: #405548;
      font-size: .8rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      border-radius: 6px;
      background: #fffcf6ea;
      padding: 3px 7px;
      pointer-events: none;
    }
    .north { display: inline-block; width: 0; height: 0; border-inline: 4px solid transparent; border-bottom: 8px solid #405548; }
    figcaption { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 8px; padding: 5px 10px; background: var(--card); color: var(--muted); font-size: .8rem; border-top: 1px solid var(--line); }
    #map-selection { color: var(--violet); font-weight: 750; }
    .map-pin {
      position: absolute;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 33px;
      height: 33px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #462b6b;
      transform: translate(-50%, -50%);
      pointer-events: auto;
    }
    .pin-marker, .rank {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      border-radius: 50% 50% 50% 9px;
      background: #e9d6fb;
      color: #502e79;
      font-size: .89rem;
      font-weight: 850;
      line-height: 1;
    }
    .pin-marker { border: 2px solid #fffcf6; box-shadow: 0 2px 4px #41295c38; }
    .pin-marker:empty { width: 15px; height: 15px; background: #7950a7; }
    .map-pin:hover, .map-pin:focus-visible, .map-pin[aria-pressed="true"] { z-index: 3; }
    .map-pin[aria-pressed="true"] .pin-marker, .town-card[aria-pressed="true"] .rank { background: #ffda65; color: #47391c; }
    .results { min-width: 0; }
    .town-list { list-style: none; padding: 0 4px 3px; margin: 0 -4px; display: grid; gap: 8px; max-height: 430px; overflow: auto; scrollbar-color: var(--line) transparent; }
    .town-card {
      display: grid;
      gap: 8px;
      text-align: start;
      width: 100%;
      min-height: 78px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      background: var(--card);
      transition: background-color 160ms ease, border-color 160ms ease;
    }
    .town-card:hover, .town-card[aria-pressed="true"] { border-color: var(--violet); background: var(--lilac); }
    .town-card-header { display: flex; align-items: center; gap: 10px; }
    .town-card strong, .town-card small { display: block; overflow-wrap: anywhere; }
    .town-card strong { font-size: 1.04rem; line-height: 1.15; }
    .town-card .region { margin-top: 2px; }
    .town-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; padding-top: 7px; border-top: 1px solid var(--line); }
    .town-facts b { display: block; font-size: .96rem; font-variant-numeric: tabular-nums; line-height: 1.25; overflow-wrap: anywhere; }
    .town-facts small, .town-card .access { font-size: .81rem; line-height: 1.3; }
    .town-facts small { margin-top: 3px; }
    .card-arrow { flex: 0 0 auto; width: 7px; height: 7px; border: solid var(--violet); border-width: 1.5px 1.5px 0 0; transform: rotate(45deg); margin-inline: auto 2px; }
    .chooser { margin: 0 0 8px; display: grid; gap: 4px; font-size: .82rem; color: var(--muted); font-weight: 700; }
    select { width: 100%; min-height: 36px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
    .panel-message { padding: 13px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
    .panel-message:empty { display: none; }
    .panel-message.hint { padding: 0 0 8px; border: 0; background: transparent; color: var(--muted); font-size: .85rem; }
    .panel-message + .retry { margin-top: 8px; }
    .snapshot { margin-top: 8px; color: var(--muted); font-size: .8rem; }
    #comparison-note { margin-top: 4px; }
    #status { color: var(--muted); margin-top: 10px; }
    #status:empty { display: none; }
    #profile { margin-top: 24px; scroll-margin-top: 8px; }
    #profile:empty { display: none; }
    .overview {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, .65fr);
      gap: 14px;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      align-items: center;
    }
    .overview h2 { font: 700 2rem/1.06 ui-serif, Georgia, serif; letter-spacing: -.03em; overflow-wrap: anywhere; }
    .overview p { margin-top: 5px; }
    .metric { border-radius: 9px; padding: 9px 11px; background: var(--sand); }
    .metric strong { display: block; margin: 2px 0; font-size: 1.24rem; font-variant-numeric: tabular-nums; }
    .evidence { margin-top: 17px; }
    .evidence p { margin-top: 5px; }
    table { width: 100%; border-collapse: collapse; margin-top: 6px; }
    th, td { padding: 7px 5px; text-align: start; border-bottom: 1px solid var(--line); vertical-align: top; }
    thead th { font-size: .82rem; color: var(--muted); }
    tbody th { width: 46%; font-weight: 620; }
    td { font-variant-numeric: tabular-nums; }
    td small, .items small { display: block; }
    .panels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .items { list-style: none; margin: 5px 0 0; padding: 0; }
    .items li { padding: 8px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
    .match-list { margin: 4px 0 0; padding-left: 21px; }
    details { margin-top: 8px; }
    summary { cursor: pointer; color: var(--forest); font-weight: 650; padding: 5px 0; }
    @media (min-width: 900px) {
      main { padding: 22px; }
      .hero { padding-inline: 34px; min-height: 232px; }
    }
    @media (max-width: 630px) {
      .workspace, .panels { grid-template-columns: minmax(0, 1fr); }
      .panels { gap: 0; }
      .map { height: 276px; }
      .town-list { max-height: 380px; }
    }
    @media (max-width: 420px) {
      main { padding: 11px; }
      .hero { min-height: 170px; padding: 15px 14px; }
      .hero h1 { font-size: 2.45rem; }
      .hero .intro { font-size: .88rem; max-width: 17ch; }
      .hero-art { width: 62%; background-position: 54% 65%; }
      .map { height: 242px; }
      .explorer { margin-top: 17px; }
      .overview { grid-template-columns: minmax(0, 1fr); gap: 9px; }
    }
    @media (prefers-reduced-motion: reduce) { .town-card { transition: none; } }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <div class="hero-art" aria-hidden="true"></div>
      <div>
        <p class="brand">relo<span>.cat</span></p>
        <h1>{{copy.title}}</h1>
        <p class="intro">{{copy.intro}}</p>
      </div>
    </header>
    <nav class="preview-nav" id="preview-nav" aria-label="{{copy.navLabel}}" hidden>
      <a href="{{copy.homeHref}}">{{copy.home}}</a>
      <a id="preview-language" href="{{copy.localeHref}}" lang="{{copy.otherLanguage}}" hreflang="{{copy.otherLanguage}}">{{copy.localeLabel}}</a>
    </nav>
    <section class="explorer" aria-labelledby="results-title">
      <div class="toolbar">
        <div class="section-label"><h2 id="results-title">{{copy.explore}}</h2><span id="count"></span></div>
        <div class="views" role="group" aria-label="{{copy.views}}" hidden>
          <button id="show-results" type="button" aria-pressed="false">{{copy.results}}</button>
          <button id="show-all" type="button" aria-pressed="false">{{copy.allTowns}}</button>
        </div>
      </div>
      <div class="workspace">
        <figure class="map-shell" aria-label="{{copy.mapLabel}}">
          <div id="map" class="map">
            <canvas aria-hidden="true"></canvas>
            <div class="map-key"><span class="north" aria-hidden="true"></span>{{copy.catalonia}}</div>
            <div id="map-pins" role="group" aria-label="{{copy.mapPins}}"></div>
            <div class="map-controls" role="group" aria-label="{{copy.controls}}">
              <div class="zoom">
                <button id="zoom-out" type="button" aria-label="{{copy.zoomOut}}" disabled>−</button>
                <button id="zoom-in" type="button" aria-label="{{copy.zoomIn}}" disabled>+</button>
              </div>
              <button id="fit-map" type="button" disabled>{{copy.fit}}</button>
            </div>
          </div>
          <figcaption><span>{{copy.mapAttribution}}<a id="map-source" target="_blank" rel="noopener noreferrer">ICGC</a> · <a id="map-license" target="_blank" rel="noopener noreferrer">CC BY 4.0</a></span><span id="map-selection"></span></figcaption>
        </figure>
        <div class="results">
          <label class="chooser" for="town" hidden>{{copy.chooser}}
            <select id="town" disabled><option value="">{{copy.selectTown}}</option></select>
          </label>
          <p id="results-status" class="panel-message" role="status">{{copy.loading}}</p>
          <button id="retry-results" class="retry" type="button" hidden>{{copy.retry}}</button>
          <ol id="town-list" class="town-list" aria-label="{{copy.cards}}"></ol>
          <p id="snapshot" class="snapshot"></p>
          <p id="comparison-note" class="snapshot" hidden>{{copy.comparison}}</p>
        </div>
      </div>
      <p id="status" role="status"></p>
      <div id="profile" aria-label="{{copy.profile}}"></div>
    </section>
    <noscript>{{copy.noScript}}</noscript>
  </main>
  <!-- WIDGET -->
</body>
</html>
