name: monorepo checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run data:validate
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t relocat .
      - name: The image starts and answers /health
        run: |
          docker run -d --name relocat -p 8787:8787 -e LIVE_DATA=off relocat
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/health && exit 0; sleep 1; done
          docker logs relocat; exit 1
