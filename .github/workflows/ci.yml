name: monorepo checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo-plugin/package-lock.json
      - run: npm ci
      - run: npm run setup:app
      - run: npm run typecheck
      - run: npm test
      - run: npm run data:validate
      - run: npm run check:app
      - run: npm run test:app
